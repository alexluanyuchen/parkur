
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Music 音乐搜索</title>
</head>

<body>

<h1>🍎 Apple Music 音乐搜索</h1>

<p>搜索你喜欢的歌曲和歌手</p>

<input
    id="keyword"
    type="text"
    placeholder="输入歌曲名或歌手名称"
>

<button onclick="searchMusic()">搜索</button>

<p id="status">等待搜索...</p>

<div id="results"></div>

<script>
async function searchMusic() {

    const keyword = document.getElementById("keyword").value.trim();
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    if (!keyword) {
        status.innerText = "请输入歌曲名称或歌手";
        return;
    }

    results.innerHTML = "";
    status.innerText = "正在搜索音乐...";

    try {

        const url =
            "https://itunes.apple.com/search?term=" +
            encodeURIComponent(keyword) +
            "&entity=song&limit=30&country=sg";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("网络请求失败");
        }

        const data = await response.json();

        if (!data.results || data.results.length === 0) {
            status.innerText = "没有找到相关音乐";
            return;
        }

        status.innerText =
            "搜索成功！共找到 " + data.resultCount + " 首歌曲";

        data.results.forEach(song => {

            const item = document.createElement("div");

            const cover = document.createElement("img");
            cover.src = song.artworkUrl100 || "";
            cover.alt = "专辑封面";
            cover.width = 120;

            const title = document.createElement("h3");
            title.textContent = song.trackName || "未知歌曲";

            const artist = document.createElement("p");
            artist.textContent = "歌手：" + song.artistName;

            const album = document.createElement("p");
            album.textContent = "专辑：" + song.collectionName;

            const link = document.createElement("a");
            link.href = song.trackViewUrl;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "在 Apple Music 中打开";

            item.appendChild(cover);
            item.appendChild(title);
            item.appendChild(artist);
            item.appendChild(album);
            item.appendChild(link);

            if (song.previewUrl) {

                const audio = document.createElement("audio");

                audio.src = song.previewUrl;
                audio.controls = true;
                audio.preload = "none";

                item.appendChild(document.createElement("br"));
                item.appendChild(document.createElement("br"));
                item.appendChild(audio);

            } else {

                const noPreview = document.createElement("p");
                noPreview.textContent = "暂无试听片段";
                item.appendChild(noPreview);

            }

            item.appendChild(document.createElement("hr"));

            results.appendChild(item);

        });

    } catch (error) {

        status.innerText =
            "搜索失败，请检查网络连接：" + error.message;

    }

}

document.getElementById("keyword")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        searchMusic();
    }

});

</script>

</body>
</html>
